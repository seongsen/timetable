<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周课表查询</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b6cdf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="周课表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ln:#e3e6ef;--ac:#2b6cdf;--today:#eaf1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a1b5;--ln:#2a3145;--ac:#6ea0ff;--today:#1f2a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a1b5;--ln:#2a3145;--ac:#6ea0ff;--today:#1f2a45;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;padding:14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mu);font-size:12px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;min-height:38px}
input,select{font-size:16px}
button{cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.wk{font-weight:600;flex:1 1 140px;text-align:center}
.wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-behavior:smooth;background:var(--card);border:1px solid var(--ln);border-radius:12px}
.g{display:grid;position:relative;width:max-content;grid-template-columns:50px repeat(7,clamp(86px,calc((100vw - 78px)/3.5),150px));grid-template-rows:auto repeat(11,46px)}
.h{padding:6px 4px;text-align:center;font-weight:600;border-bottom:1px solid var(--ln)}
.h.co{position:sticky;left:0;z-index:6;background:var(--card);box-shadow:1px 0 0 var(--ln)}
.h small{display:block;color:var(--mu);font-weight:400;font-size:11px}
.h.t{color:var(--ac)}
.pl{position:sticky;left:0;z-index:5;background:var(--card);box-shadow:1px 0 0 var(--ln);font-size:10px;color:var(--mu);padding:3px 2px;text-align:center;border-top:1px solid var(--ln);line-height:1.2}
.pl b{display:block;color:var(--tx);font-size:11px}
.c{border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.c.t{background:var(--today)}
.cr{margin:2px;padding:4px 6px;border-radius:8px;font-size:11px;line-height:1.3;overflow:hidden;border-left:4px solid var(--k);background:color-mix(in srgb,var(--k) 16%,var(--card))}
.cr b{display:block;font-size:12px}
.cr span{color:var(--mu)}
.clk{color:var(--mu);font-size:12px}
.pl.live{background:var(--today);color:var(--ac)}
.cr.live{outline:2px solid var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.nl{position:relative;pointer-events:none;z-index:3}
.nl i{position:absolute;left:0;right:0;height:2px;background:#e5484d}
.nl i::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#e5484d}
h2{font-size:15px;margin:16px 0 8px}
.ls{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.li{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--k);border-radius:10px;padding:8px 10px}
.li b{display:block}.li span{color:var(--mu);font-size:12px;display:block}
.empty{color:var(--mu);padding:10px 0}
label{font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<h1>📅 周课表查询</h1>
<div class="sub">江苏大学 · 2026-2027 秋学期</div>
<div class="bar">
  <button id="prev">‹ 上一周</button>
  <span class="wk" id="wk"></span>
  <button id="next">下一周 ›</button>
  <select id="sel" aria-label="选择周次"></select>
  <button id="now" class="p">回到本周</button>
  <button id="win">☀️ 夏令时间</button>
  <span class="clk" id="clk"></span>
</div>
<div class="wrap"><div class="g" id="g"></div></div>
<h2>本周课程</h2>
<div class="ls" id="ls"></div>

<script>
var COURSES=[
 {n:"矩阵论",r:"Y203(M)",t:"蒋书敏",w:[4,13],s:[[1,1,2],[3,1,2]],k:"#2b6cdf"},
 {n:"文献阅读与翻译(基础)",r:"Y104(M)",t:"肖艳娟",w:[3,18],s:[[1,3,4]],k:"#12a38a"},
 {n:"热流体科学理论",r:"Y306(M)",t:"王晓英",w:[7,18],s:[[2,1,4]],k:"#e0782b"},
 {n:"数值分析",r:"Y104(M)",t:"王林君",w:[4,13],s:[[1,7,8],[5,7,8]],k:"#8a56d6"},
 {n:"新时代中国特色社会主义理论与实践",r:"Y204(M)",t:"王红伟",w:[10,19],s:[[3,9,11]],k:"#d6456b"},
 {n:"自然辩证法概论",r:"Y203(M)",t:"靳媛媛",w:[3,9],s:[[7,9,11]],k:"#7a8b1f"}
];
var SUMMER=["8:00-8:45","8:55-9:40","10:10-10:55","11:05-11:50","14:00-14:45","14:55-15:40","16:00-16:45","16:55-17:40","19:00-19:45","19:55-20:40","20:50-21:35"];
var WINTER=["8:00-8:45","8:55-9:40","10:10-10:55","11:05-11:50","13:30-14:15","14:25-15:10","15:30-16:15","16:25-17:10","18:30-19:15","19:25-20:10","20:20-21:05"];
var winter=false;
try{winter=localStorage.getItem("tt_winter")==="1"}catch(e){}
var TIMES=winter?WINTER:SUMMER;
var DAYS=["周一","周二","周三","周四","周五","周六","周日"];
var MAXW=20, DAY=864e5;
var START="2026-08-31", sel=document.getElementById("sel");
var week=1;

function pad(n){return n<10?"0"+n:""+n}
function fmt(d){return pad(d.getMonth()+1)+"/"+pad(d.getDate())}
function parse(v){var p=v.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function curWeek(){return Math.floor((today()-parse(START))/DAY/7)+1}

// 第1周周一固定为 8月31日(10月17日 = 第7周)

for(var i=1;i<=MAXW;i++){var o=document.createElement("option");o.value=i;o.textContent="第 "+i+" 周";sel.appendChild(o)}

function mins(s){var a=s.split(":");return +a[0]*60+ +a[1]}
function st(p){return mins(TIMES[p-1].split("-")[0])}
function en(p){return mins(TIMES[p-1].split("-")[1])}
function nowInfo(){var d=new Date(),m=d.getHours()*60+d.getMinutes(),p=null;for(var i=1;i<=11;i++){if(m>=st(i)&&m<=en(i))p=i}return{m:m,p:p}}
function linePos(m){var r=null;for(var i=1;i<=11;i++){if(m>=st(i))r=i}if(!r||m>en(11))return null;return{p:r,f:Math.min(1,(m-st(r))/(en(r)-st(r)))}}
function render(){
  var lv=nowInfo();
  var s=parse(START), mon=new Date(s.getTime()+(week-1)*7*DAY);
  var td=today(), g=document.getElementById("g"), html="";
  document.getElementById("wk").textContent="第 "+week+" 周 · "+fmt(mon)+" – "+fmt(new Date(mon.getTime()+6*DAY));
  sel.value=week;
  html+='<div class="h co"></div>';
  var tcol=-1;
  for(var d=0;d<7;d++){
    var dd=new Date(mon.getTime()+d*DAY), isT=dd.getTime()===td.getTime();
    if(isT)tcol=d;
    html+='<div class="h'+(isT?' t':'')+'" style="grid-column:'+(d+2)+';grid-row:1">'+DAYS[d]+'<small>'+fmt(dd)+'</small></div>';
  }
  for(var p=1;p<=11;p++){
    html+='<div class="pl'+(tcol>=0&&lv.p===p?' live':'')+'" style="grid-column:1;grid-row:'+(p+1)+'"><b>第'+p+'节</b>'+TIMES[p-1].replace("-","<br>")+'</div>';
    for(var d2=0;d2<7;d2++)html+='<div class="c'+(d2===tcol?' t':'')+'" style="grid-column:'+(d2+2)+';grid-row:'+(p+1)+'"></div>';
  }
  var act=[];
  COURSES.forEach(function(c){
    if(week<c.w[0]||week>c.w[1])return;
    act.push(c);
    c.s.forEach(function(x){
      html+='<div class="cr'+(((x[0]-1===tcol)&&lv.m>=st(x[1])&&lv.m<=en(x[2]))?' live':'')+'" style="--k:'+c.k+';grid-column:'+(x[0]+1)+';grid-row:'+(x[1]+1)+'/'+(x[2]+2)+'"><b>'+c.n+'</b><span>'+c.r+'<br>'+c.t+'</span></div>';
    });
  });
  if(tcol>=0){var lp=linePos(lv.m);if(lp)html+='<div class="nl" style="grid-column:'+(tcol+2)+';grid-row:'+(lp.p+1)+'"><i style="top:'+(lp.f*100)+'%"></i></div>'}
  g.innerHTML=html;
  var ls=document.getElementById("ls");
  if(!act.length){ls.innerHTML='<div class="empty">这一周没有课 🎉</div>';return}
  ls.innerHTML=act.map(function(c){
    var when=c.s.map(function(x){return DAYS[x[0]-1]+" 第"+x[1]+"-"+x[2]+"节 ("+TIMES[x[1]-1].split("-")[0]+"-"+TIMES[x[2]-1].split("-")[1]+")"}).join(";");
    return '<div class="li" style="--k:'+c.k+'"><b>'+c.n+'</b><span>'+when+'</span><span>'+c.r+' · '+c.t+' · 第'+c.w[0]+"-"+c.w[1]+'周</span></div>';
  }).join("");
}
function focusDay(){var w=document.querySelector(".wrap"),t=document.querySelector("#g .h.t");w.scrollLeft=t?Math.max(0,t.offsetLeft-50):0}
function go(w){week=Math.max(1,Math.min(MAXW,w));render();focusDay()}
document.getElementById("prev").onclick=function(){go(week-1)};
document.getElementById("next").onclick=function(){go(week+1)};
document.getElementById("now").onclick=function(){go(curWeek())};
sel.onchange=function(){go(+sel.value)};
var winBtn=document.getElementById("win");
function setWin(v){winter=v;TIMES=v?WINTER:SUMMER;winBtn.textContent=v?"🌙 冬令时间":"☀️ 夏令时间";winBtn.className=v?"p":"";try{localStorage.setItem("tt_winter",v?"1":"0")}catch(e){}render()}
winBtn.onclick=function(){setWin(!winter)};
function tick(){var d=new Date();document.getElementById("clk").textContent="现在 "+fmt(d)+" 周"+"日一二三四五六".charAt(d.getDay())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+" · 第"+curWeek()+"周";render()}
setWin(winter);
go(curWeek());
tick();
setInterval(tick,30000);
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
